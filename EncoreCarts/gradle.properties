org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mappings (parameter names only, runtime stays Mojang-mapped)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Compiled against the oldest supported NeoForge build (EncoreCraftNew 2.0.0 and Foxy also require 21.1.227+); newer 21.1.x builds are accepted at runtime.
neo_version=21.1.227
neo_version_range=[21.1.227,)
loader_version_range=[4,)

## Optional integrations (compile-only, never bundled)
# Xaero's World Map NeoForge 1.21.1 1.44.2 (Modrinth version id). Its map-element API is identical up to 1.47.0.
xaero_worldmap_version=55gtOc9Y
# Set to true to start the dev client with Xaero's World Map for manual testing.
dev_with_xaero=false

## Mod
mod_id=encorecarts
mod_name=EncoreCarts
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.encorecraft.encorecarts
mod_authors=EncoreCraft
mod_description=Balanced cart travel between stations: coachman NPC, distance based price, discovery, cinematic travel cutscene.
